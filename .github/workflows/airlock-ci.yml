name: AIRLOCK CI

on:
  push:
    paths:
      - "projects/airlock/**"
      - ".github/workflows/airlock-ci.yml"
  pull_request:
    paths:
      - "projects/airlock/**"
      - ".github/workflows/airlock-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/airlock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/airlock/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
